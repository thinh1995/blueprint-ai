name: Validate AI project template

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Completed task-evidence records verify immutable artifacts at their
      # source revisions, so the validator needs the repository history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
      - name: Validate installer and template tests
        run: |
          bash -n setup.sh tests/setup.sh tests/validate-docs.sh tests/render-mermaid.sh template-paths.sh
          python3 -B -c 'import ast, pathlib; [ast.parse(p.read_bytes(), filename=str(p)) for d in ("lib", "tools", "tests") for p in sorted(pathlib.Path(d).glob("*.py"))]'
          bash tests/setup.sh < /dev/null
          bash tests/validate-docs.sh
          bash setup.sh --doctor
          python3 -B tests/validate-antigravity-conformance-fixture.py
          python3 -B tools/validate-task-evidence.py --evidence-dir docs/internal/task-evidence --require-completed
          npm install -g @mermaid-js/mermaid-cli@11.4.2
          if [ "$RUNNER_OS" = "Linux" ]; then
            MMDC_PUPPETEER_CONFIG=tests/puppeteer-no-sandbox.json bash tests/render-mermaid.sh
          else
            bash tests/render-mermaid.sh
          fi
