name: Validate AI project template

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Completed task-evidence records verify immutable artifacts at their
      # source revisions, so the validator needs the repository history.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Validate installer and template tests
        run: |
          bash -n setup.sh tests/setup.sh tests/validate-docs.sh tests/render-mermaid.sh template-paths.sh
          bash tests/setup.sh
          bash tests/validate-docs.sh
          python3 tests/validate-task-evidence.py --evidence-dir docs/internal/task-evidence --require-completed
          npm install -g @mermaid-js/mermaid-cli@11.4.2
          if [ "$RUNNER_OS" = "Linux" ]; then
            MMDC_PUPPETEER_CONFIG=tests/puppeteer-no-sandbox.json bash tests/render-mermaid.sh
          else
            bash tests/render-mermaid.sh
          fi
