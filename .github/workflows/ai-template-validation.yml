name: Validate AI project template

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate installer and template tests
        run: |
          bash -n setup.sh tests/setup.sh tests/validate-docs.sh template-paths.sh
          bash tests/setup.sh
          bash tests/validate-docs.sh
          python3 tests/validate-task-evidence.py
